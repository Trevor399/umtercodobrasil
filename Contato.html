    <main class="conteudo">

        <h2>Contato</h2>

        <p>

            Entre em contato com nossa equipe através do formulário abaixo.

        </p>

        <hr>

        <form class="formulario" action="#" method="POST">

            <label for="nome">

                Nome

            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
                required
            >

            <label for="email">

                E-mail

            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="mensagem">

                Mensagem

            </label>

            <textarea
                id="mensagem"
                name="mensagem"
                rows="6"
                placeholder="Digite sua mensagem"
                required
            ></textarea>

            <button type="submit">

                Enviar mensagem

            </button>

        </form>

    </main>

</body>
